version: 2
updates:
  # Python dependencies (reads requirements*.txt + pyproject.toml)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]

  # GitHub Actions used by the workflows above
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The digest-pinned base image in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # CI tests the 3.11 line; move to a newer Python deliberately, not via a bot.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
