name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the scan sees every commit
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the Dockerfile base. The lock is resolved per interpreter
          # and platform, so auditing it on anything else audits a set that
          # will never be deployed.
          python-version: "3.11"
      - name: pip-audit (known CVEs in the pinned runtime tree)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-lock.txt
