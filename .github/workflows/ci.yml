name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # The whole suite runs in mock mode: no Ollama, no model, no network,
      # no external services. Deterministic and self-contained.
      CV_LLM_MODE: mock
      CV_API_KEY: ci-test-key
      # Tesseract is installed below, so the OCR golden checks must run here:
      # tests/test_golden.py fails instead of skipping them.
      CV_REQUIRE_OCR: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Tesseract OCR (eng + ara) for the golden set
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara fonts-dejavu-core
          tesseract --list-langs

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Tests + coverage
        run: |
          coverage run -m pytest
          coverage report

      - name: Golden-set scorecard
        run: python -m tests.eval_golden "$RUNNER_TEMP/golden"
